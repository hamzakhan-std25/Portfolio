<?xml version="1.0" encoding="UTF-8"?>
<svg id="svg-features" viewBox="0 0 1200 675" width="1200" height="675" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="feat-bg" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#0B0F17"/>
              <stop offset="50%" stop-color="#111827"/>
              <stop offset="100%" stop-color="#070A0F"/>
            </linearGradient>
            <linearGradient id="neon-glow" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#8B5CF6"/>
              <stop offset="50%" stop-color="#06B6D4"/>
              <stop offset="100%" stop-color="#10B981"/>
            </linearGradient>
            <filter id="purple-blur" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur stdDeviation="35" result="blur"/>
            </filter>
          </defs>

          <!-- Background Base -->
          <rect width="1200" height="675" fill="url(#feat-bg)"/>

          <!-- Glowing Orbs -->
          <circle cx="150" cy="500" r="250" fill="#8B5CF6" opacity="0.12" filter="url(#purple-blur)"/>
          <circle cx="1050" cy="150" r="280" fill="#06B6D4" opacity="0.1" filter="url(#purple-blur)"/>

          <!-- Title Banner -->
          <g transform="translate(60, 45)">
            <text x="0" y="24" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="24" letter-spacing="-0.5">Strategy &amp; Trajectory Engine</text>
            <text x="0" y="46" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">Detailed Growth Trajectory, Audio Intelligence &amp; Radar Metrics</text>
          </g>

          <!-- Main Layout Grid -->

          <!-- 1. Left Box: Growth Trajectory Line Chart -->
          <g transform="translate(60, 110)">
            <rect x="0" y="0" width="680" height="310" rx="16" fill="#131B2A" stroke="#1E293B"/>
            <text x="24" y="32" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700">30-Day Growth Trajectory vs. Benchmark</text>
            
            <!-- Badge -->
            <rect x="520" y="18" width="136" height="26" rx="13" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-opacity="0.3"/>
            <text x="532" y="35" fill="#10B981" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">Outperforming +184%</text>

            <!-- Line Chart Area -->
            <g transform="translate(24, 70)">
              <!-- Grid lines -->
              <line x1="0" y1="0" x2="630" y2="0" stroke="#1E293B"/>
              <line x1="0" y1="50" x2="630" y2="50" stroke="#1E293B"/>
              <line x1="0" y1="100" x2="630" y2="100" stroke="#1E293B"/>
              <line x1="0" y1="150" x2="630" y2="150" stroke="#1E293B"/>
              <line x1="0" y1="200" x2="630" y2="200" stroke="#1E293B"/>

              <!-- Benchmark Line (Dashed) -->
              <path d="M0 170 Q 150 160, 300 140 T 630 110" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 6"/>

              <!-- Actual Growth Curve Area fill -->
              <path d="M0 180 Q 120 160, 220 110 T 420 80 T 630 20 L 630 200 L 0 200 Z" fill="url(#neon-glow)" fill-opacity="0.12"/>

              <!-- Actual Growth Curve Line -->
              <path d="M0 180 Q 120 160, 220 110 T 420 80 T 630 20" fill="none" stroke="url(#neon-glow)" stroke-width="4" stroke-linecap="round"/>

              <!-- Data Points -->
              <circle cx="220" cy="110" r="5" fill="#06B6D4"/>
              <circle cx="420" cy="80" r="5" fill="#10B981"/>
              <circle cx="630" cy="20" r="7" fill="#10B981"/>
              <circle cx="630" cy="20" r="14" fill="#10B981" fill-opacity="0.3"/>

              <!-- Timeline Labels -->
              <text x="0" y="218" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Week 1</text>
              <text x="150" y="218" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Week 2</text>
              <text x="300" y="218" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Week 3</text>
              <text x="450" y="218" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Week 4</text>
              <text x="600" y="218" fill="#10B981" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700">Now</text>
            </g>
          </g>

          <!-- 2. Right Box: Audience Radar / Multi-Metric Chart -->
          <g transform="translate(760, 110)">
            <rect x="0" y="0" width="380" height="310" rx="16" fill="#131B2A" stroke="#1E293B"/>
            <text x="24" y="32" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700">Audience Quality Radar</text>

            <!-- Polygon Radar Graphics -->
            <g transform="translate(190, 170)">
              <!-- Outer Web Polygon -->
              <polygon points="0,-90 78,-28 48,65 -48,65 -78,-28" fill="none" stroke="#1E293B" stroke-width="1.5"/>
              <!-- Mid Web Polygon -->
              <polygon points="0,-60 52,-19 32,43 -32,43 -52,-19" fill="none" stroke="#1E293B" stroke-width="1.5"/>
              <!-- Inner Web Polygon -->
              <polygon points="0,-30 26,-9 16,21 -16,21 -26,-9" fill="none" stroke="#1E293B" stroke-width="1.5"/>

              <!-- Axis Lines -->
              <line x1="0" y1="0" x2="0" y2="-90" stroke="#1E293B"/>
              <line x1="0" y1="0" x2="78" y2="-28" stroke="#1E293B"/>
              <line x1="0" y1="0" x2="48" y2="65" stroke="#1E293B"/>
              <line x1="0" y1="0" x2="-48" y2="65" stroke="#1E293B"/>
              <line x1="0" y1="0" x2="-78" y2="-28" stroke="#1E293B"/>

              <!-- Data Shape -->
              <polygon points="0,-80 70,-20 40,50 -35,55 -60,-20" fill="#06B6D4" fill-opacity="0.25" stroke="#06B6D4" stroke-width="2"/>

              <!-- Labels -->
              <text x="0" y="-100" text-anchor="middle" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Retention</text>
              <text x="90" y="-28" text-anchor="start" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Shares</text>
              <text x="55" y="80" text-anchor="middle" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Comments</text>
              <text x="-55" y="80" text-anchor="middle" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Rewatches</text>
              <text x="-90" y="-28" text-anchor="end" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Likes</text>
            </g>
          </g>

          <!-- 3. Bottom Row: Strategy Badges & AI Recommendations Cards -->

          <!-- Recommendation 1: Time & Audio -->
          <g transform="translate(60, 445)">
            <rect x="0" y="0" width="325" height="185" rx="16" fill="#131B2A" stroke="#1E293B"/>
            <rect x="20" y="20" width="130" height="24" rx="12" fill="#8B5CF6" fill-opacity="0.15" stroke="#8B5CF6" stroke-opacity="0.3"/>
            <text x="30" y="36" fill="#C4B5FD" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700">⚡ AI RECOMMENDATION</text>

            <text x="20" y="70" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700">Post at 6:00 PM EST</text>
            <text x="20" y="92" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Your followers are most active. Slots in this window get 2.4x initial boost.</text>

            <rect x="20" y="125" width="285" height="38" rx="8" fill="#0F172A" stroke="#1E293B"/>
            <text x="32" y="148" fill="#10B981" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">Impact: High Virality Chance</text>
          </g>

          <!-- Recommendation 2: Audio Detection -->
          <g transform="translate(415, 445)">
            <rect x="0" y="0" width="325" height="185" rx="16" fill="#131B2A" stroke="#1E293B"/>
            <rect x="20" y="20" width="145" height="24" rx="12" fill="#06B6D4" fill-opacity="0.15" stroke="#06B6D4" stroke-opacity="0.3"/>
            <text x="30" y="36" fill="#06B6D4" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700">🎵 AUDIO INTELLIGENCE</text>

            <text x="20" y="70" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700">Trending Sound Detected</text>
            <text x="20" y="92" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">"Neon Pulse Sub-bass" is trending in tech &amp; SaaS niches (+310% usage).</text>

            <rect x="20" y="125" width="285" height="38" rx="8" fill="#0F172A" stroke="#1E293B"/>
            <text x="32" y="148" fill="#06B6D4" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">Suggested Action: Add to draft</text>
          </g>

          <!-- Recommendation 3: Content Structure -->
          <g transform="translate(770, 445)">
            <rect x="0" y="0" width="370" height="185" rx="16" fill="#131B2A" stroke="#1E293B"/>
            <rect x="20" y="20" width="135" height="24" rx="12" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-opacity="0.3"/>
            <text x="30" y="36" fill="#10B981" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700">💡 HOOK OPTIMIZATION</text>

            <text x="20" y="70" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700">Use "Problem-First" Hook</text>
            <text x="20" y="92" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Videos starting with a direct question retain 42% more viewers past 5 seconds.</text>

            <rect x="20" y="125" width="330" height="38" rx="8" fill="#0F172A" stroke="#1E293B"/>
            <text x="32" y="148" fill="#8B5CF6" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">Expected Lift: +45% Completion Rate</text>
          </g>

        </svg>