<svg id="svg-thumb" viewBox="0 0 1200 630" width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
                            <defs>
                                <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stop-color="#0b1120"/>
                                    <stop offset="50%" stop-color="#0f172a"/>
                                    <stop offset="100%" stop-color="#040711"/>
                                </linearGradient>
                                <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                                    <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
                                    <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
                                </linearGradient>
                                <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stop-color="#06b6d4"/>
                                    <stop offset="100%" stop-color="#3b82f6"/>
                                </linearGradient>
                                <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
                                    <stop offset="0%" stop-color="#10b981"/>
                                    <stop offset="100%" stop-color="#059669"/>
                                </linearGradient>
                                <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
                                    <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.5"/>
