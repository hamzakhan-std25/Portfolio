                                <pattern id="thumbGrid" width="40" height="40" patternUnits="userSpaceOnUse">
                                    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.25"/>
                                </pattern>
                            </defs>

                            <!-- Background -->
                            <rect width="1200" height="630" fill="url(#bgGrad)"/>
