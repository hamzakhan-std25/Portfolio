                                <rect x="0" y="0" width="390" height="330" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
                                
                                <!-- Card Header -->
                                <rect x="0" y="0" width="390" height="45" rx="16" fill="#1e293b"/>
                                <text x="20" y="27" font-family="'Inter', sans-serif" font-weight="600" font-size="13" fill="#e2e8f0">STATION TELEMETRY LIVE</text>
                                <circle cx="360" cy="22" r="4" fill="#10b981"/>

                                <!-- Mini Telemetry Chart -->
                                <g transform="translate(20, 65)">
