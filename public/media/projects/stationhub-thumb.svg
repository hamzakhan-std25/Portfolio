                                    <rect x="0" y="0" width="110" height="34" rx="8" fill="#0f172a" stroke="#059669" stroke-width="1"/>
                                    <text x="14" y="21" font-family="'Inter', sans-serif" font-weight="600" font-size="13" fill="#10b981">FastAPI</text>
                                    
                                    <!-- Python -->
                                    <rect x="120" y="0" width="100" height="34" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
                                    <text x="134" y="21" font-family="'Inter', sans-serif" font-weight="600" font-size="13" fill="#60a5fa">Python</text>

                                    <!-- Firestore -->
                                    <rect x="230" y="0" width="110" height="34" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
                                    <text x="244" y="21" font-family="'Inter', sans-serif" font-weight="600" font-size="13" fill="#fbbf24">Firestore</text>

                                    <!-- React -->
                                    <rect x="350" y="0" width="100" height="34" rx="8" fill="#0f172a" stroke="#06b6d4" stroke-width="1"/>
                                    <text x="364" y="21" font-family="'Inter', sans-serif" font-weight="600" font-size="13" fill="#38bdf8">React.js</text>
                                </g>
                            </g>

