                                    <text x="12" y="24" font-family="'Inter', sans-serif" font-weight="500" font-size="11" fill="#94a3b8">Occupancy</text>
                                    <text x="12" y="55" font-family="'Inter', sans-serif" font-weight="700" font-size="20" fill="#10b981">88%</text>

                                    <rect x="120" y="0" width="105" height="80" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
                                    <text x="132" y="24" font-family="'Inter', sans-serif" font-weight="500" font-size="11" fill="#94a3b8">Queue Count</text>
                                    <text x="132" y="55" font-family="'Inter', sans-serif" font-weight="700" font-size="20" fill="#f59e0b">6 EVs</text>

                                    <rect x="240" y="0" width="110" height="80" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
                                    <text x="252" y="24" font-family="'Inter', sans-serif" font-weight="500" font-size="11" fill="#94a3b8">Role Auth</text>
                                    <text x="252" y="55" font-family="'Inter', sans-serif" font-weight="700" font-size="15" fill="#a855f7">RBAC Active</text>
                                </g>
                            </g>

                            <!-- Footer Ribbon -->
                            <g transform="translate(130, 520)">
                                <text x="0" y="0" font-family="'Inter', sans-serif" font-weight="500" font-size="13" fill="#64748b">Architecture: FastAPI · Firestore · React · Tailwind · Pydantic · Zod · Erdantic</text>
