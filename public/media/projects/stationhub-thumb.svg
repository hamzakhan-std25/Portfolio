                                    <text x="0" y="38" font-family="'Inter', sans-serif" font-weight="700" font-size="22" fill="#38bdf8">482.5 kW</text>
                                    
                                    <!-- Sparkline Chart -->
                                    <path d="M 0 110 Q 50 60 100 85 T 200 40 T 300 70 L 350 30" fill="none" stroke="#06b6d4" stroke-width="3" stroke-linecap="round"/>
                                    <path d="M 0 110 Q 50 60 100 85 T 200 40 T 300 70 L 350 30 L 350 130 L 0 130 Z" fill="url(#cyanGlow)" opacity="0.15"/>
                                </g>

