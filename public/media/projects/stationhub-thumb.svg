                                <text x="0" y="75" font-family="'Inter', sans-serif" font-weight="800" font-size="38" fill="url(#cyanGlow)">Automotive Management</text>
                                
                                <text x="0" y="120" font-family="'Inter', sans-serif" font-weight="400" font-size="16" fill="#94a3b8" width="500">
                                    Real-time telemetry, queue management, and multi-tenant RBAC
                                </text>
                                <text x="0" y="145" font-family="'Inter', sans-serif" font-weight="400" font-size="16" fill="#94a3b8">
                                    backed by strict FastAPI and Pydantic data contracts.
                                </text>

                                <!-- Tech Badges -->
                                <g transform="translate(0, 185)">
