                                    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
                                </circle>
                                <text x="32" y="21" font-family="'Inter', sans-serif" font-weight="600" font-size="12" fill="#38bdf8">24/24 STATIONS ONLINE</text>
                            </g>

