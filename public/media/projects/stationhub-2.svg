<svg id="svg-arch" viewBox="0 0 1200 700" width="1200" height="700" xmlns="http://www.w3.org/2000/svg">
                            <defs>
                                <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stop-color="#080c14"/>
                                    <stop offset="100%" stop-color="#0f172a"/>
                                </linearGradient>
                                <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#06b6d4"/>
                                </marker>
                            </defs>

                            <!-- Background -->
                            <rect width="1200" height="700" fill="url(#archBg)"/>

                            <!-- Header -->
                            <text x="50" y="55" font-family="'Inter', sans-serif" font-weight="800" font-size="24" fill="#ffffff">STATION HUB ARCHITECTURE &amp; DATA CONTRACTS</text>
                            <text x="50" y="80" font-family="'Inter', sans-serif" font-size="13" fill="#64748b">Multi-Tenant Role-Based Routing, FastAPI Gateway, Schema Validation &amp; Firestore NoSQL</text>

                            <!-- LAYER 1: CLIENTS & ROLES (Left) -->
                            <g transform="translate(50, 130)">
                                <rect x="0" y="0" width="220" height="500" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
                                <text x="20" y="35" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#06b6d4" letter-spacing="1">1. MULTI-TENANT ROLES</text>

                                <!-- Role Card 1: Super Admin -->
                                <g transform="translate(15, 60)">
                                    <rect x="0" y="0" width="190" height="120" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
                                    <text x="16" y="28" font-family="'Inter', sans-serif" font-weight="700" font-size="14" fill="#a855f7">Super Admin</text>
                                    <text x="16" y="50" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">• Platform Management</text>
                                    <text x="16" y="68" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">• Global Station Telemetry</text>
                                    <text x="16" y="86" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">• RBAC &amp; Tenant Provisioning</text>
                                </g>

                                <!-- Role Card 2: Station Owner -->
                                <g transform="translate(15, 200)">
                                    <rect x="0" y="0" width="190" height="120" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
                                    <text x="16" y="28" font-family="'Inter', sans-serif" font-weight="700" font-size="14" fill="#38bdf8">Station Owner</text>
                                    <text x="16" y="50" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">• Station Operational View</text>
                                    <text x="16" y="68" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">• Charger Queue Tracking</text>
                                    <text x="16" y="86" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">• Local Pricing &amp; Metrics</text>
                                </g>

                                <!-- Role Card 3: Mobile Customer -->
                                <g transform="translate(15, 340)">
                                    <rect x="0" y="0" width="190" height="120" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
                                    <text x="16" y="28" font-family="'Inter', sans-serif" font-weight="700" font-size="14" fill="#10b981">Customer (App)</text>
                                    <text x="16" y="50" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">• Station Discovery</text>
                                    <text x="16" y="68" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">• Real-time Slot Booking</text>
                                    <text x="16" y="86" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">• Charging Telemetry Tracking</text>
                                </g>
                            </g>

                            <!-- Connecting Arrows (Layer 1 -> Layer 2) -->
                            <path d="M 270 250 L 340 250" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrow)"/>
                            <path d="M 270 390 L 340 390" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrow)"/>

                            <!-- LAYER 2: REST GATEWAY & VALIDATION CONTRACTS (Center) -->
                            <g transform="translate(350, 130)">
                                <rect x="0" y="0" width="460" height="500" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
                                <text x="24" y="35" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#06b6d4" letter-spacing="1">2. FASTAPI GATEWAY &amp; STRICT DATA CONTRACTS</text>

                                <!-- FastAPI Gateway Box -->
                                <g transform="translate(24, 60)">
                                    <rect x="0" y="0" width="412" height="160" rx="12" fill="#1e293b" stroke="#059669" stroke-width="1.5"/>
                                    <rect x="16" y="16" width="90" height="26" rx="6" fill="#10b981" fill-opacity="0.2"/>
                                    <text x="61" y="33" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#10b981" text-anchor="middle">FastAPI REST</text>

                                    <text x="120" y="34" font-family="'Inter', sans-serif" font-weight="700" font-size="15" fill="#ffffff">Python REST Gateway</text>
                                    <text x="16" y="70" font-family="'Inter', sans-serif" font-size="12" fill="#cbd5e1">• RBAC Auth Middleware (Token Claims &amp; Role Scopes)</text>
                                    <text x="16" y="92" font-family="'Inter', sans-serif" font-size="12" fill="#cbd5e1">• Automated Telemetry &amp; Queue Ingestion Pipeline</text>

                                    <!-- Contract Validation Badges -->
                                    <g transform="translate(16, 115)">
                                        <rect x="0" y="0" width="180" height="30" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
                                        <text x="90" y="19" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#10b981" text-anchor="middle">Pydantic Schemas (Backend)</text>

                                        <rect x="195" y="0" width="180" height="30" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
                                        <text x="285" y="19" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#38bdf8" text-anchor="middle">Zod Models (Frontend)</text>
                                    </g>
                                </g>

                                <!-- Schema Code Sample Box -->
                                <g transform="translate(24, 240)">
                                    <rect x="0" y="0" width="412" height="230" rx="12" fill="#090d16" stroke="#334155" stroke-width="1"/>
                                    <rect x="0" y="0" width="412" height="30" rx="12" fill="#1e293b"/>
                                    <text x="16" y="20" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#94a3b8">DATA CONTRACT MODEL (Pydantic / Zod)</text>

                                    <text x="16" y="55" font-family="'JetBrains Mono', monospace" font-size="11" fill="#f43f5e">class <tspan fill="#38bdf8">StationTelemetry</tspan>(BaseModel):</text>
                                    <text x="36" y="75" font-family="'JetBrains Mono', monospace" font-size="11" fill="#e2e8f0">station_id: <tspan fill="#10b981">str</tspan></text>
                                    <text x="36" y="95" font-family="'JetBrains Mono', monospace" font-size="11" fill="#e2e8f0">power_output_kw: <tspan fill="#10b981">float</tspan> = Field(gt=0)</text>
                                    <text x="36" y="115" font-family="'JetBrains Mono', monospace" font-size="11" fill="#e2e8f0">active_chargers: <tspan fill="#10b981">List[ChargerBay]</tspan></text>
                                    <text x="36" y="135" font-family="'JetBrains Mono', monospace" font-size="11" fill="#e2e8f0">occupancy_rate: <tspan fill="#10b981">float</tspan></text>
                                    <text x="36" y="155" font-family="'JetBrains Mono', monospace" font-size="11" fill="#e2e8f0">tenant_role: <tspan fill="#10b981">RoleEnum</tspan></text>
                                    
                                    <text x="16" y="195" font-family="'Inter', sans-serif" font-size="11" fill="#10b981">✓ Strict validation passed on all API payloads</text>
                                </g>
                            </g>

                            <!-- Connecting Arrows (Layer 2 -> Layer 3) -->
                            <path d="M 810 250 L 870 250" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrow)"/>
                            <path d="M 810 430 L 870 430" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrow)"/>

                            <!-- LAYER 3: FIRESTORE & ERDANTIC ENGINE (Right) -->
                            <g transform="translate(880, 130)">
                                <rect x="0" y="0" width="270" height="500" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
                                <text x="20" y="35" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#06b6d4" letter-spacing="1">3. PERSISTENCE &amp; ERD</text>

                                <!-- Firestore Database Node -->
                                <g transform="translate(15, 60)">
                                    <rect x="0" y="0" width="240" height="180" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
                                    <rect x="16" y="16" width="100" height="26" rx="6" fill="#f59e0b" fill-opacity="0.2"/>
                                    <text x="66" y="33" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#fbbf24" text-anchor="middle">Firestore DB</text>
                                    
                                    <text x="16" y="68" font-family="'Inter', sans-serif" font-weight="600" font-size="13" fill="#ffffff">Multi-Tenant Store</text>
                                    <text x="16" y="92" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">• /stations/{id}/telemetry</text>
                                    <text x="16" y="112" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">• /queues/{id}/priority</text>
                                    <text x="16" y="132" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">• /users/{id}/rbac_roles</text>
                                    <text x="16" y="152" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">• /logs/{id}/audit_trail</text>
                                </g>

                                <!-- Erdantic Automated ERD Engine -->
                                <g transform="translate(15, 260)">
                                    <rect x="0" y="0" width="240" height="210" rx="12" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
                                    <rect x="16" y="16" width="110" height="26" rx="6" fill="#a855f7" fill-opacity="0.2"/>
                                    <text x="71" y="33" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#c084fc" text-anchor="middle">Erdantic Engine</text>

                                    <text x="16" y="68" font-family="'Inter', sans-serif" font-weight="600" font-size="13" fill="#ffffff">Automated Diagramming</text>
                                    <text x="16" y="92" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Generates live Database ERD</text>
                                    <text x="16" y="110" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">diagrams directly from Pydantic</text>
                                    <text x="16" y="128" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">data models during CI/CD.</text>

                                    <rect x="16" y="150" width="208" height="40" rx="8" fill="#090d16" stroke="#334155" stroke-width="1"/>
                                    <text x="120" y="174" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#c084fc" text-anchor="middle">erdantic.draw(StationModel)</text>
                                </g>
                            </g>
                        </svg>