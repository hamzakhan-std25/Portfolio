              <stop offset="0%" stop-color="#0B0F17"/>
              <stop offset="60%" stop-color="#0F172A"/>
              <stop offset="100%" stop-color="#080C14"/>
            </linearGradient>
            <linearGradient id="cyan-emerald" x1="0" y1="0" x2="1" y2="0">
