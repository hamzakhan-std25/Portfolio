              <text x="96" y="20" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Likes</text>
              <text x="96" y="38" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">248K</text>

              <rect x="172" y="0" width="76" height="50" rx="8" fill="#0F172A" stroke="#1E293B"/>
              <text x="182" y="20" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Shares</text>
              <text x="182" y="38" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">42.1K</text>
